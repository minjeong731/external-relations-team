name: Verify shared storage backend
on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:
jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auth, shared storage, files and roles
        run: python -m unittest discover -s server -v
